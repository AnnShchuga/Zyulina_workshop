<section class="zm zm-sec zm-cta">
<style>
.zm-cta__box{background:var(--zm-ink);color:#fff;border-radius:40px;padding:var(--zm-s6);display:grid;grid-template-columns:1.3fr 1fr;gap:var(--zm-s5);align-items:center;position:relative;overflow:hidden}
.zm-cta__box .zm-h2{color:#fff}
.zm-cta__box p{font-size:18px;opacity:.92;margin-top:16px;max-width:44ch}
.zm-cta__btns{display:grid;gap:12px}
.zm-cta__btns .zm-btn{justify-content:center}
.zm-cta__btns .zm-btn--ghost{color:#fff;border-color:#fff}
.zm-cta__btns .zm-btn--ghost:hover{background:#fff;color:var(--zm-ink)}
.zm-cta__dot{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--zm-red);opacity:.9}
@media (max-width:900px){.zm-cta__box{grid-template-columns:1fr;padding:var(--zm-s4) var(--zm-s3);border-radius:28px}}
</style>
<div class="zm-wrap zm-z">
  <div class="zm-cta__box">
    <span class="zm-cta__dot" aria-hidden="true"></span>
    <div class="zm-z">
      <h2 class="zm-h2">Не знаете,<br>с&nbsp;чего начать?</h2>
      <p>Напишите, для кого занятие и&nbsp;сколько будет человек. Подберу мастер-класс и&nbsp;формат, отвечу на&nbsp;вопросы о&nbsp;материалах.</p>
    </div>
    <div class="zm-cta__btns zm-z">
      <a class="zm-btn zm-btn--accent zm-todo" href="https://t.me/USERNAME">Написать в&nbsp;Telegram</a>
      <a class="zm-btn zm-btn--ghost zm-todo" href="https://vk.com/USERNAME">Написать во&nbsp;ВКонтакте</a>
      <a class="zm-btn zm-btn--ghost" href="/contacts">Все контакты</a>
    </div>
  </div>
</div>
</section>

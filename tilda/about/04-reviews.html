<section class="zm zm-sec zm-rv">
<style>
.zm-rv__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--zm-s3);margin-top:var(--zm-s5)}
.zm-rv__card{background:var(--zm-paper);border-radius:var(--zm-radius);padding:var(--zm-s4);display:flex;flex-direction:column;gap:var(--zm-s2);position:relative}
.zm-rv__card::before{content:'«';position:absolute;top:-6px;right:24px;font:700 96px/1 var(--zm-font-display);color:var(--zm-red);opacity:.35}
.zm-rv__who{display:flex;align-items:center;gap:12px;margin-top:auto}
.zm-rv__ava{width:44px;height:44px;border-radius:50%;background:var(--zm-lilac)}
.zm-rv__who b{display:block;color:var(--zm-ink)}
.zm-rv__who span{font-size:14px;color:var(--zm-muted)}
@media (max-width:900px){.zm-rv__grid{grid-template-columns:1fr}}
</style>
<div class="zm-deco zm-wave" style="left:-60px;bottom:20px"></div>
<div class="zm-wrap zm-z">
  <h2 class="zm-h2">Что<br><span class="zm-red">говорят</span></h2>
  <!-- ЗАГЛУШКИ: заменить реальными отзывами с разрешения авторов. Выдуманные отзывы не публиковать. -->
  <div class="zm-rv__grid">
    <figure class="zm-rv__card zm-todo" style="margin:0"><blockquote style="margin:0">[Текст реального отзыва родителя: что делали, что понравилось ребёнку]</blockquote><figcaption class="zm-rv__who"><span class="zm-rv__ava"></span><span><b>[Имя]</b><span>[мастер-класс, формат]</span></span></figcaption></figure>
    <figure class="zm-rv__card zm-todo" style="margin:0"><blockquote style="margin:0">[Отзыв взрослого участника онлайн-занятия]</blockquote><figcaption class="zm-rv__who"><span class="zm-rv__ava" style="background:var(--zm-peach)"></span><span><b>[Имя]</b><span>[мастер-класс, формат]</span></span></figcaption></figure>
    <figure class="zm-rv__card zm-todo" style="margin:0"><blockquote style="margin:0">[Отзыв заказчика работы: что заказывал, к какому поводу]</blockquote><figcaption class="zm-rv__who"><span class="zm-rv__ava" style="background:var(--zm-teal)"></span><span><b>[Имя]</b><span>[работа на заказ]</span></span></figcaption></figure>
  </div>
</div>
</section>

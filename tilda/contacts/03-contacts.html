<section class="zm zm-sec zm-ct" style="padding-top:0">
<style>
.zm-ct__grid{display:grid;grid-template-columns:repeat(2,1fr);max-width:860px;gap:var(--zm-s3)}
.zm-ct__card{background:var(--zm-paper);border-radius:var(--zm-radius);padding:var(--zm-s4);display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--zm-text);border:2px solid transparent;transition:border-color .2s}
.zm-ct__card:hover{border-color:var(--zm-ink)}
.zm-ct__card b{font:700 30px/1 var(--zm-font-display);text-transform:uppercase;color:var(--zm-ink)}

.zm-ct__form{margin-top:var(--zm-s5);border:2px dashed var(--zm-line);border-radius:var(--zm-radius);padding:var(--zm-s4);text-align:center;color:var(--zm-muted)}
.zm-ct__topic{margin-top:var(--zm-s3);font-weight:700;color:var(--zm-ink)}
@media (max-width:900px){.zm-ct__grid{grid-template-columns:1fr}}
</style>
<div class="zm-wrap zm-z">
  <div class="zm-ct__grid">
    <a class="zm-ct__card" href="https://vk.com/id598297974"><b>ВКонтакте</b><span>Сообщения, новые работы и&nbsp;анонсы</span><span>vk.com/id598297974</span></a>
    <a class="zm-ct__card" href="mailto:zyulil@mail.ru"><b>Почта</b><span>Для заказов и&nbsp;программ для организаций</span><span>zyulil@mail.ru</span></a>

</div>
<script>

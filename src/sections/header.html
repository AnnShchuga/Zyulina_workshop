<header class="zm zm-hd" id="top">
<style>
.zm-hd{position:relative;z-index:20;padding:20px 0}
.zm-hd .zm-wrap{display:flex;align-items:center;justify-content:space-between;gap:24px}
.zm-hd__logo{display:block;width:104px;height:104px;flex:none}
.zm-hd__nav{display:flex;align-items:center;gap:32px}
.zm-hd__nav a{text-decoration:none;font-weight:700;font-size:16px;color:var(--zm-ink);padding:8px 0;border-bottom:2px solid transparent}
.zm-hd__nav a:hover,.zm-hd__nav a[aria-current]{border-color:var(--zm-red)}
.zm-hd__nav .zm-btn{color:#fff;border-bottom-width:2px;padding:10px 22px}
.zm-hd__nav .zm-btn:hover{border-color:var(--zm-ink-dark)}
.zm-hd__burger{display:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--zm-ink);background:var(--zm-paper);cursor:pointer;position:relative}
.zm-hd__burger span,.zm-hd__burger span::before,.zm-hd__burger span::after{position:absolute;left:12px;width:20px;height:2px;background:var(--zm-ink);content:'';transition:transform .2s}
.zm-hd__burger span{top:22px}.zm-hd__burger span::before{left:0;top:-6px}.zm-hd__burger span::after{left:0;top:6px}
@media (max-width:1040px){
  .zm-hd__logo{width:76px;height:76px}
  .zm-hd__burger{display:block}
  .zm-hd__nav{position:absolute;top:100%;left:16px;right:16px;flex-direction:column;align-items:stretch;gap:0;
    background:var(--zm-paper);border-radius:var(--zm-radius);box-shadow:0 18px 40px rgba(52,71,79,.18);padding:12px 20px 20px;display:none}
  .zm-hd.is-open .zm-hd__nav{display:flex}
  .zm-hd__nav a{padding:14px 0;border-bottom:1px solid var(--zm-line)}
  .zm-hd__nav .zm-btn{margin-top:16px;justify-content:center;border-bottom:2px solid var(--zm-ink)}
}
</style>
<div class="zm-wrap">
  <a class="zm-hd__logo" href="{{L:index}}" aria-label="На главную">
    <img src="{{A}}/decor/logo.svg" width="104" height="104" alt="Творческая мастерская Людмилы Зюлиной">
  </a>
  <button class="zm-hd__burger" type="button" aria-label="Открыть меню" aria-expanded="false"><span></span></button>
  <nav class="zm-hd__nav" aria-label="Основное меню">
    <a href="{{L:index}}" data-page="index">Главная</a>
    <a href="{{L:workshops}}" data-page="workshops">Мастер-классы</a>
    <a href="{{L:works}}" data-page="works">Работы на заказ</a>
    <a href="{{L:about}}" data-page="about">Обо мне</a>
    <a href="{{L:blog}}" data-page="blog">Блог</a>
    <a class="zm-btn" href="{{L:contacts}}" data-page="contacts">Записаться</a>
  </nav>
</div>
<script>
(function(){
  var hd=document.currentScript.closest('.zm-hd');
  var b=hd.querySelector('.zm-hd__burger');
  b.addEventListener('click',function(){
    var o=hd.classList.toggle('is-open');
    b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Закрыть меню':'Открыть меню');
  });
  var cur=document.body.getAttribute('data-zm-page')||(location.pathname.split('/').pop().replace('.html','')||'index');
  if(cur){var a=hd.querySelector('[data-page="'+cur+'"]');if(a)a.setAttribute('aria-current','page');}
})();
</script>
</header>

<style>
.zm{
  /* Цвета сняты пипеткой с концепта */
  --zm-bg:#F8F5F0;        /* тёплый молочный фон */
  --zm-paper:#FFFDF9;     /* карточки */
  --zm-ink:#435A67;       /* сланцевый: заголовки, кнопки */
  --zm-ink-dark:#34474F;  /* hover для сланцевого */
  --zm-red:#E8523F;       /* коралловый акцент */
  --zm-red-dark:#C9402F;
  --zm-text:#2B2B2B;      /* основной текст, не чистый чёрный */
  --zm-muted:#5F6B70;     /* второстепенный текст, контраст ≥4.5:1 на фоне */
  --zm-line:#E4DED4;
  --zm-peach:#F6C9A3; --zm-pink:#F2A7A2; --zm-lilac:#C9B6E8; --zm-teal:#3AA0B8;
  /* Шрифты. Заголовочный — временная замена, пока нет названия шрифта из Figma */
  --zm-font-display:'Yanone Kaffeesatz','Arial Narrow',sans-serif;
  --zm-font-text:'PT Sans',Arial,sans-serif;
  /* Шкала отступов, база 8 px */
  --zm-s1:8px;--zm-s2:16px;--zm-s3:24px;--zm-s4:32px;--zm-s5:48px;--zm-s6:64px;--zm-s7:96px;
  --zm-radius:24px; --zm-radius-s:12px;
  --zm-max:1200px;
  --zm-assets:'https://annshchuga.github.io/Zyulina_workshop/assets';
  font-family:var(--zm-font-text);color:var(--zm-text);
  font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.zm,.zm *{box-sizing:border-box}
.zm img{max-width:100%;display:block}
.zm a:not(.zm-btn){color:inherit}
.zm h1,.zm h2,.zm h3,.zm p{margin:0}
.zm-page{background:var(--zm-bg) url('https://annshchuga.github.io/Zyulina_workshop/assets/decor/seigaiha-bg.svg') repeat;background-size:120px 60px}
.zm-wrap{max-width:var(--zm-max);margin:0 auto;padding:0 var(--zm-s3);position:relative}
/* Обрезаем декор только по бокам: по вертикали круги и звёзды могут заходить на соседние секции */
.zm-sec{position:relative;padding:var(--zm-s7) 0;overflow-x:clip;overflow-y:visible}

/* Заголовки: две строки, сланцевая + коралловая, как в концепте */
.zm-h1,.zm-h2{font-family:var(--zm-font-display);font-weight:700;text-transform:uppercase;line-height:.92;letter-spacing:.01em}
.zm-h1,.zm-h2,.zm-h3{overflow-wrap:break-word}
.zm-h1{font-size:clamp(48px,8.4vw,116px);color:var(--zm-ink)}
.zm-h2{font-size:clamp(40px,6vw,84px);color:var(--zm-ink)}
.zm-h3{font-family:var(--zm-font-display);font-weight:700;text-transform:uppercase;font-size:30px;line-height:1;color:var(--zm-ink)}
.zm-red{color:var(--zm-red)}
.zm-lead{font-size:19px;line-height:1.5;max-width:56ch}
.zm-muted{color:var(--zm-muted)}

/* Кнопки */
.zm-btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 26px;border-radius:999px;
  font:700 16px/1 var(--zm-font-text);text-decoration:none;cursor:pointer;border:2px solid var(--zm-ink);
  background:var(--zm-ink);color:#fff;transition:background .2s,color .2s,transform .2s}
.zm-btn:hover{background:var(--zm-ink-dark);border-color:var(--zm-ink-dark)}
.zm-btn:active{transform:translateY(1px)}
.zm-btn:focus-visible{outline:3px solid var(--zm-red);outline-offset:3px}
.zm-btn--accent{background:var(--zm-red);border-color:var(--zm-red)}
.zm-btn--accent:hover{background:var(--zm-red-dark);border-color:var(--zm-red-dark)}
.zm-btn--ghost{background:transparent;color:var(--zm-ink)}
.zm-btn--ghost:hover{background:var(--zm-ink);color:#fff}
.zm-btn--s{min-height:40px;padding:8px 18px;font-size:15px}

/* Метки форматов: цвет продублирован словом — не полагаемся только на цвет */
.zm-tag{display:inline-block;padding:5px 12px;border-radius:999px;font:700 13px/1.2 var(--zm-font-text);background:var(--zm-ink);color:#fff}
.zm-tag--online{background:#2E7F93}
.zm-tag--offline{background:var(--zm-red-dark)}
.zm-tag--rec{background:#6A55A0}
.zm-tag--pdf{background:#7A5A1E}

/* Декор: звёзды, круги, «волны» */
.zm-deco{position:absolute;pointer-events:none;z-index:0}
.zm-star{width:48px;height:48px;background:var(--zm-ink);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.zm-star--s{width:22px;height:22px}
.zm-star--l{width:84px;height:84px}
.zm-dot{width:150px;height:150px;border-radius:50%;background:var(--zm-red)}
.zm-wave{width:200px;height:200px;border-radius:50%;background:url('https://annshchuga.github.io/Zyulina_workshop/assets/decor/seigaiha-dark.svg') center/56px 28px}
.zm-z{position:relative;z-index:1}

/* Горизонтальная лента карточек со стрелками */
.zm-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:var(--zm-s3);overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 16px;scrollbar-width:thin}
.zm-rail>*{scroll-snap-align:start}
.zm-arrows{display:flex;gap:12px}
.zm-arrow{width:48px;height:48px;border-radius:50%;border:2px solid var(--zm-ink);background:transparent;color:var(--zm-ink);font-size:20px;cursor:pointer}
.zm-arrow--fill{background:var(--zm-ink);color:#fff}
.zm-arrow:focus-visible{outline:3px solid var(--zm-red);outline-offset:3px}

/* Пометка «заменить»: видна только на превью GitHub, чтобы не забыть */
.zm-todo{}

@media (max-width:768px){
  .zm{font-size:16px}
  .zm-sec{padding:var(--zm-s6) 0}
  .zm-wrap{padding:0 var(--zm-s2)}
  .zm-dot{width:90px;height:90px}
  .zm-wave{width:120px;height:120px}
  .zm-star--l{display:none}
}
@media (prefers-reduced-motion:reduce){.zm *{transition:none!important;scroll-behavior:auto!important}}
body,.t-records{background:#F8F5F0 url('https://annshchuga.github.io/Zyulina_workshop/assets/decor/seigaiha-bg.svg') repeat;background-size:120px 60px}
</style>
<script>
/* Адрес почты собирается только в браузере: в коде страницы его нет, ботам-сборщикам нечего взять.
   Без JS ссылка ведёт на страницу контактов. */
(function(){
  function addr(a){var p=a.getAttribute('data-zm-mail').split('|');return 'mailto:'+p[0]+'@'+p[1];}
  function fix(){[].forEach.call(document.querySelectorAll('[data-zm-mail]'),function(a){a.href=addr(a);});}
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-zm-mail]');if(a){a.href=addr(a);}},true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();
  window.addEventListener('load',fix);
})();
</script>
